<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Quest — Space Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2ff;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-strong: #ffffff;
      --text: #17203b;
      --muted: #66708f;
      --border: #dbe1f2;
      --primary: #5b4cf0;
      --primary-hover: #493ad7;
      --accent: #b745e8;
      --correct: #168a53;
      --correct-bg: #def8e9;
      --wrong: #c83e52;
      --wrong-bg: #ffe2e7;
      --stars: rgba(91, 76, 240, 0.28);
      --stars-soft: rgba(183, 69, 232, 0.18);
      --shadow: 0 24px 60px rgba(50, 42, 120, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0d1020;
        --surface: rgba(25, 29, 52, 0.94);
        --surface-strong: #202541;
        --text: #f4f5ff;
        --muted: #aeb5d0;
        --border: #353c60;
        --primary: #8d7cff;
        --primary-hover: #a394ff;
        --accent: #df69ff;
        --correct: #5ee3a0;
        --correct-bg: #153e31;
        --wrong: #ff8292;
        --wrong-bg: #4a202b;
        --stars: rgba(196, 187, 255, 0.38);
        --stars-soft: rgba(223, 105, 255, 0.24);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(112, 92, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 90% 85%, rgba(221, 71, 232, 0.14), transparent 26rem),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      background-image:
        radial-gradient(circle, var(--stars) 1px, transparent 1.5px),
        radial-gradient(circle, var(--stars-soft) 1.5px, transparent 2px);
      background-position: 0 0, 42px 58px;
      background-size: 92px 92px, 157px 157px;
      pointer-events: none;
      will-change: transform;
    }

    body::before {
      animation: star-drift 34s linear infinite alternate;
    }

    body::after {
      background-position: 24px 16px, 96px 32px;
      background-size: 131px 131px, 211px 211px;
      opacity: 0.55;
      transform: scale(0.8);
      animation: star-drift-soft 46s linear infinite alternate;
    }

    main {
      position: relative;
      width: min(100%, 560px);
      z-index: 1;
    }

    .brand {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 12px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--primary), var(--border) 58%);
      border-radius: 16px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--primary), transparent 93%) 1px, transparent 1px) 0 0 / 16px 100%,
        var(--surface);
      box-shadow: 0 10px 28px rgba(50, 42, 120, 0.1);
      color: var(--text);
      backdrop-filter: blur(16px);
    }

    .brand::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(var(--primary), var(--accent));
    }

    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid color-mix(in srgb, var(--primary), transparent 45%);
      border-radius: 50%;
      background: color-mix(in srgb, var(--primary), transparent 88%);
      color: var(--primary);
      font-size: 17px;
      box-shadow: inset 0 0 0 4px var(--surface), 0 0 18px color-mix(in srgb, var(--primary), transparent 65%);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 14px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 45%);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .brand-copy {
      display: grid;
      line-height: 1.15;
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-title {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .brand-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border: 1px solid color-mix(in srgb, var(--correct), transparent 65%);
      border-radius: 999px;
      background: color-mix(in srgb, var(--correct-bg), transparent 25%);
      color: var(--correct);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--correct), transparent 82%);
      animation: signal 2s ease-in-out infinite;
    }

    .card {
      padding: clamp(24px, 6vw, 38px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
    }

    .progress {
      height: 9px;
      margin-bottom: 30px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--border);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.18;
      letter-spacing: -0.035em;
    }

    h1 {
      max-width: 440px;
      font-size: clamp(25px, 6vw, 34px);
    }

    h2 {
      font-size: clamp(30px, 7vw, 42px);
    }

    .answers {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .answer {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px 17px;
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--surface-strong);
      color: var(--text);
      font: inherit;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(91, 76, 240, 0.12);
    }

    .answer:focus-visible,
    .next-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary), transparent 55%);
      outline-offset: 3px;
    }

    .answer-key {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .answer.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
      animation: pop 420ms ease;
    }

    .answer.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
      animation: shake 430ms ease;
    }

    .answer.reveal {
      border-color: var(--correct);
      color: var(--correct);
    }

    .answer:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 26px;
      margin: 18px 0 0;
      font-weight: 750;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .feedback.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .feedback.correct {
      color: var(--correct);
    }

    .feedback.wrong {
      color: var(--wrong);
    }

    .next-button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 15px 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(91, 76, 240, 0.24);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .next-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .next-button[hidden] {
      display: none;
    }

    .results {
      text-align: center;
      animation: rise 500ms ease both;
    }

    .reaction {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 68px;
      line-height: 1;
      filter: drop-shadow(0 10px 12px rgba(49, 42, 112, 0.18));
      animation: float 2.4s ease-in-out infinite;
    }

    .result-score {
      margin: 15px 0 7px;
      color: var(--primary);
      font-size: 20px;
      font-weight: 850;
    }

    .result-message {
      max-width: 380px;
      margin: 0 auto 22px;
      color: var(--muted);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }

    @keyframes signal {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @keyframes star-drift {
      from { transform: translate3d(-8px, -5px, 0); }
      to { transform: translate3d(18px, 12px, 0); }
    }

    @keyframes star-drift-soft {
      from { transform: scale(0.8) translate3d(10px, -8px, 0); }
      to { transform: scale(0.8) translate3d(-16px, 14px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 16px 12px;
      }

      .brand-status {
        padding-inline: 7px;
      }

      .card {
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="Orbit Quest mission control, system online">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-copy">
        <span class="brand-kicker">Mission control</span>
        <span class="brand-title">Orbit Quest</span>
      </span>
      <span class="brand-status" aria-hidden="true"><span class="status-light"></span>Online</span>
    </header>
    <section class="card" id="quiz-card" aria-live="polite">
      <div id="quiz-screen">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score">★ <span id="score">0</span> points</span>
        </div>
        <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="eyebrow" id="category">The Solar System</p>
        <h1 id="question">Loading mission…</h1>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" role="status"></p>
        <button class="next-button" id="next-button" type="button" hidden>Next question →</button>
      </div>
      <div class="results" id="results-screen" hidden>
        <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h2 id="result-title">Stellar work!</h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-message" id="result-message"></p>
        <button class="next-button" id="restart-button" type="button">Launch again ↻</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "The Solar System",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because iron minerals in its soil oxidize, or rust."
      },
      {
        category: "Moon Missions",
        question: "Who was the first person to walk on the Moon?",
        answers: ["Yuri Gagarin", "Buzz Aldrin", "Neil Armstrong", "Sally Ride"],
        correct: 2,
        fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969."
      },
      {
        category: "Spacecraft",
        question: "What was the name of the first artificial satellite?",
        answers: ["Voyager 1", "Sputnik 1", "Explorer 1", "Hubble"],
        correct: 1,
        fact: "Sputnik 1 was launched by the Soviet Union in October 1957."
      },
      {
        category: "Deep Space",
        question: "Which spacecraft has traveled farthest from Earth?",
        answers: ["Cassini", "New Horizons", "Voyager 1", "Juno"],
        correct: 2,
        fact: "Voyager 1 entered interstellar space in 2012 and continues sending data."
      },
      {
        category: "Astronomy",
        question: "What is the closest star to Earth after the Sun?",
        answers: ["Sirius", "Betelgeuse", "Polaris", "Proxima Centauri"],
        correct: 3,
        fact: "Proxima Centauri is about 4.24 light-years from Earth."
      },
      {
        category: "Living in Space",
        question: "About how often does the ISS orbit Earth each day?",
        answers: ["Once", "4 times", "16 times", "50 times"],
        correct: 2,
        fact: "The ISS circles Earth roughly every 90 minutes—about 16 times per day."
      },
      {
        category: "Mars Exploration",
        question: "Which rover landed on Mars in February 2021?",
        answers: ["Curiosity", "Perseverance", "Spirit", "Opportunity"],
        correct: 1,
        fact: "Perseverance landed in Jezero Crater and carried the Ingenuity helicopter."
      },
      {
        category: "Giant Planets",
        question: "Which planet has the Great Red Spot?",
        answers: ["Saturn", "Neptune", "Uranus", "Jupiter"],
        correct: 3,
        fact: "Jupiter's Great Red Spot is a giant storm that has persisted for centuries."
      },
      {
        category: "Telescopes",
        question: "The James Webb Space Telescope primarily observes which kind of light?",
        answers: ["Ultraviolet", "Infrared", "X-ray", "Radio"],
        correct: 1,
        fact: "Webb uses infrared light to peer through dust and study the early universe."
      },
      {
        category: "Cosmic Distances",
        question: "A light-year measures what?",
        answers: ["Time", "Brightness", "Distance", "Speed"],
        correct: 2,
        fact: "A light-year is the distance light travels in one year: about 9.46 trillion km."
      }
    ];

    const elements = {
      quizScreen: document.querySelector("#quiz-screen"),
      resultsScreen: document.querySelector("#results-screen"),
      count: document.querySelector("#question-count"),
      score: document.querySelector("#score"),
      progress: document.querySelector(".progress"),
      progressBar: document.querySelector("#progress-bar"),
      category: document.querySelector("#category"),
      question: document.querySelector("#question"),
      answers: document.querySelector("#answers"),
      feedback: document.querySelector("#feedback"),
      next: document.querySelector("#next-button"),
      restart: document.querySelector("#restart-button"),
      reaction: document.querySelector("#reaction"),
      resultTitle: document.querySelector("#result-title"),
      resultScore: document.querySelector("#result-score"),
      resultMessage: document.querySelector("#result-message")
    };

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;
      elements.count.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      elements.score.textContent = score;
      elements.progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      elements.progress.setAttribute("aria-valuenow", currentQuestion + 1);
      elements.category.textContent = item.category;
      elements.question.textContent = item.question;
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.next.hidden = true;
      elements.answers.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-key">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index, button));
        elements.answers.appendChild(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const buttons = [...elements.answers.querySelectorAll(".answer")];
      buttons.forEach(button => {
        button.disabled = true;
      });

      if (index === item.correct) {
        score += 1;
        selectedButton.classList.add("correct");
        elements.feedback.textContent = `Correct! ${item.fact}`;
        elements.feedback.className = "feedback correct visible";
      } else {
        selectedButton.classList.add("wrong");
        buttons[item.correct].classList.add("reveal");
        elements.feedback.textContent = `Not quite. ${item.fact}`;
        elements.feedback.className = "feedback wrong visible";
      }

      elements.score.textContent = score;
      elements.next.textContent = currentQuestion === questions.length - 1 ? "See my results →" : "Next question →";
      elements.next.hidden = false;
      elements.next.focus({ preventScroll: true });
    }

    function showResults() {
      const percentage = Math.round((score / questions.length) * 100);
      let result;

      if (score >= 9) {
        result = ["🌟", "Cosmic genius!", "Your space knowledge is truly out of this world."];
      } else if (score >= 7) {
        result = ["🚀", "Stellar work!", "Mission accomplished—you clearly know your way around the cosmos."];
      } else if (score >= 5) {
        result = ["🛰️", "Nice orbit!", "A solid flight. A little more training and you'll be mission-ready."];
      } else {
        result = ["👽", "Keep exploring!", "Every astronaut starts somewhere. Launch again and beat your score!"];
      }

      elements.quizScreen.hidden = true;
      elements.resultsScreen.hidden = false;
      elements.reaction.textContent = result[0];
      elements.resultTitle.textContent = result[1];
      elements.resultScore.textContent = `${score} / ${questions.length} correct · ${percentage}%`;
      elements.resultMessage.textContent = result[2];
      elements.restart.focus({ preventScroll: true });
    }

    elements.next.addEventListener("click", () => {
      currentQuestion += 1;
      if (currentQuestion < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    });

    elements.restart.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      elements.resultsScreen.hidden = true;
      elements.quizScreen.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
